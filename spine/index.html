<body>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { SNIPPETS } from './snippets.js';

const PLAYER_RADIUS = 0.35;
const EYE_HEIGHT = 1.7;
const WALK_SPEED = 3.0;   // m/s
const RUN_SPEED = 6.0;    // m/s
const HEARD_KEY = 'halcyon-lore-heard';
const NPC_COUNT = 60;
const NPC_SEED = parseInt(new URLSearchParams(location.search).get('seed') || '1', 10);
const TOPIC_COUNT = Object.keys(SNIPPETS).length;

// --- Renderer, scene, camera --------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c7);
scene.fog = new THREE.Fog(0x9fb4c7, 300, 900);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 2000);

// --- Lighting (skylight from above) ------------------------------------------
scene.add(new THREE.HemisphereLight(0xe8f0ff, 0x3a3a3a, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(-200, 400, 100);
scene.add(sun);

// --- Controls and overlay -----------------------------------------------------
const controls = new PointerLockControls(camera, renderer.domElement);
const overlay = document.getElementById('overlay');
let panelOpen = false;     // the journal is open (mouse is released)

let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
}

overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => { overlay.classList.add('hidden'); ensureAudio(); });
controls.addEventListener('unlock', () => { if (!panelOpen) overlay.classList.remove('hidden'); });

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyE') useNearest();
  if (e.code === 'KeyJ') toggleJournal();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// --- Collision data (Blender coordinates: bx = x, by = -three.z) -------------
let bounds = { min: [0, -20], max: [1600, 20] };
let colliders = [];
let spine = { x0: 0, x1: 1600, length: 1600 };
let doors = [];       // { name, light, side, x, y, mat }
let pois = [];

// Electric train: an Object3D named "Train" in the GLB. Its position.x is the Blender X of
// the rear (aft) end. It runs between the two ends of the Spine and pauses at each end.
let train = null;
let trainSpec = { length: 69, half_width: 1.5, speed: 6.94 };
let trainMin = 130, trainMax = 1400;
let trainX = 130;
let trainDir = 1;
let trainPause = 0;
const TRAIN_PAUSE_SECONDS = 6;

function trainBox(margin) {
  return { x0: trainX - margin, x1: trainX + trainSpec.length + margin, hw: trainSpec.half_width + margin };
}

function updateTrain(dt) {
  if (!train) return;
  if (trainPause > 0) {
    trainPause -= dt;
  } else {
    trainX += trainDir * trainSpec.speed * dt;
    if (trainX >= trainMax) { trainX = trainMax; trainDir = -1; trainPause = TRAIN_PAUSE_SECONDS; }
    if (trainX <= trainMin) { trainX = trainMin; trainDir = 1; trainPause = TRAIN_PAUSE_SECONDS; }
  }
  train.position.x = trainX;
}

function blocked(bx, by) {
  if (bx < bounds.min[0] + PLAYER_RADIUS || bx > bounds.max[0] - PLAYER_RADIUS) return true;
  if (by < bounds.min[1] + PLAYER_RADIUS || by > bounds.max[1] - PLAYER_RADIUS) return true;
  if (train) {
    const tb = trainBox(PLAYER_RADIUS);
    if (bx > tb.x0 && bx < tb.x1 && Math.abs(by) < tb.hw) return true;
  }
  for (const c of colliders) {
    if (c.type === 'box') {
      if (bx > c.min[0] - PLAYER_RADIUS && bx < c.max[0] + PLAYER_RADIUS &&
          by > c.min[1] - PLAYER_RADIUS && by < c.max[1] + PLAYER_RADIUS) return true;
    } else if (c.type === 'circle') {
      const dx = bx - c.center[0], dy = by - c.center[1];
      const r = c.radius + PLAYER_RADIUS;
      if (dx * dx + dy * dy < r * r) return true;
    }
  }
  return false;
}

// --- Movement with wall sliding ----------------------------------------------
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);

function updateMovement(dt) {
  if (!controls.isLocked) return;

  // If the train has reached the player, push them out to the nearest side of the track.
  if (train) {
    const tb = trainBox(PLAYER_RADIUS);
    const px = camera.position.x, py = -camera.position.z;
    if (px > tb.x0 && px < tb.x1 && Math.abs(py) < tb.hw) {
      const side = py >= 0 ? 1 : -1;
      camera.position.z = -(side * tb.hw);
    }
  }

  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  right.crossVectors(forward, UP).normalize();

  let f = 0, r = 0;
  if (keys['KeyW'] || keys['ArrowUp']) f += 1;
  if (keys['KeyS'] || keys['ArrowDown']) f -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) r += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) r -= 1;
  if (f === 0 && r === 0) return;

  const speed = (keys['ShiftLeft'] || keys['ShiftRight'] ? RUN_SPEED : WALK_SPEED) * dt;
  const dx = forward.x * f + right.x * r;
  const dz = forward.z * f + right.z * r;
  const len = Math.hypot(dx, dz);
  const mx = (dx / len) * speed;
  // Blender y runs opposite to three.js z (by = -three.z), so the y step is negated.
  const my = -(dz / len) * speed;

  const bx = camera.position.x;
  const by = -camera.position.z;

  let nx = bx, ny = by;
  if (!blocked(bx + mx, by + my)) {
    nx = bx + mx; ny = by + my;
  } else if (!blocked(bx + mx, by)) {
    nx = bx + mx;
  } else if (!blocked(bx, by + my)) {
    ny = by + my;
  }

  camera.position.x = nx;
  camera.position.z = -ny;
}

// --- Lore: topics, discovery, journal ------------------------------------------
// A "topic" is one lore file. You learn a topic by hearing one of its lines in conversation.
let heard = new Set();
let heardText = {};   // lore file -> the line the player heard
let titles = {};      // lore file -> title (from the file's first heading)
const TOPICS = Object.keys(SNIPPETS).sort();

function loadHeard() {
  try {
    const saved = JSON.parse(localStorage.getItem(HEARD_KEY) || '{}');
    heardText = saved && !Array.isArray(saved) ? saved : {};
  } catch (e) {
    heardText = {};
  }
  heard = new Set(Object.keys(heardText));
}

function saveHeard() {
  try { localStorage.setItem(HEARD_KEY, JSON.stringify(heardText)); } catch (e) { /* storage unavailable */ }
}

function titleOf(file) {
  return titles[file] || file.replace(/\.md$/, '').replace(/_/g, ' ');
}

// Hearing a topic for the first time reveals it, and the line that was said is kept.
// Returns true if it was new.
function hear(file, line) {
  if (heard.has(file)) return false;
  heard.add(file);
  heardText[file] = line || SNIPPETS[file];
  saveHeard();
  showNotice(`Learned: ${titleOf(file)}`, 4, true);
  return true;
}

// --- Notices, dialogue, knock subtitles ---------------------------------------
const noticeEl = document.getElementById('notice');
const knockEl = document.getElementById('knock');
const dialogueEl = document.getElementById('dialogue');
const dialogueWho = dialogueEl.querySelector('.who');
const dialogueText = dialogueEl.querySelector('.text');
let noticeUntil = 0, knockUntil = 0, dialogueUntil = 0;

function showNotice(text, seconds, gold) {
  noticeEl.textContent = text;
  noticeEl.classList.toggle('gold', !!gold);
  noticeEl.style.display = 'block';
  noticeUntil = performance.now() + seconds * 1000;
}

function showDialogue(who, text, seconds = 20) {
  dialogueWho.textContent = who;
  dialogueText.textContent = text;
  dialogueEl.style.display = 'block';
  dialogueUntil = performance.now() + seconds * 1000;
}

function updateOverlays() {
  const now = performance.now();
  if (now > noticeUntil) noticeEl.style.display = 'none';
  if (now > knockUntil) knockEl.style.display = 'none';
  if (now > dialogueUntil) dialogueEl.style.display = 'none';
}

// --- Journal (J) ----------------------------------------------------------------
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('ptitle');
const panelText = document.getElementById('ptext');
const panelClose = document.getElementById('pclose');

function openJournal() {
  const lines = TOPICS.map(file => heard.has(file)
    ? `[x] ${titleOf(file)}\n      "${heardText[file]}"`
    : '[ ] ???');
  panelOpen = true;
  panelTitle.textContent = `Journal: ${heard.size} / ${TOPIC_COUNT} heard`;
  panelText.textContent =
    'Talk to people on the Spine (E). They will tell you things, and each new topic is added here.\n' +
    'Some of the ship\'s customs are only shared through knocks on the doors.\n\n' +
    lines.join('\n\n');
  panelText.scrollTop = 0;
  panel.style.display = 'flex';
  overlay.classList.add('hidden');
  controls.unlock();
}

function closePanel() {
  panelOpen = false;
  panel.style.display = 'none';
  controls.lock();
}

panelClose.addEventListener('click', closePanel);

function toggleJournal() {
  if (panelOpen) { closePanel(); return; }
  openJournal();
}

// --- Interaction: nearest interactable, prompt --------------------------------
const POI_RANGE = 5.0;
const NPC_RANGE = 2.2;
const promptEl = document.getElementById('prompt');
let interactables = [];   // { x, y, range, label(), use() }
let nearest = null;

function useNearest() {
  if (panelOpen) { closePanel(); return; }
  if (nearest) nearest.use();
}

function updateInteraction() {
  const bx = camera.position.x;
  const by = -camera.position.z;
  let best = null, bestRatio = Infinity;
  for (const it of interactables) {
    const d = Math.hypot(it.x - bx, it.y - by);
    if (d <= it.range && d / it.range < bestRatio) { bestRatio = d / it.range; best = it; }
  }
  nearest = best;
  if (nearest && !panelOpen) {
    promptEl.textContent = `[E] ${nearest.label()}`;
    promptEl.style.display = 'block';
  } else {
    promptEl.style.display = 'none';
  }
}

// --- Knock codes -----------------------------------------------------------------
// Patterns from lore/knock_codes_and_cabin_talk.md. Beats: 'k' knock, 'q' quick knock,
// 'L' long knock, '-' a pause.
const KNOCK_TOPIC = 'knock_codes_and_cabin_talk.md';
const KNOCK_PATTERNS = [
  { meaning: 'Are you awake?',          rhythm: 'knock ... knock',              beats: 'k-k' },
  { meaning: 'Good night',              rhythm: 'two quick knocks',              beats: 'qq' },
  { meaning: 'Come and see this',       rhythm: 'three knocks, one long',        beats: 'qqqL' },
  { meaning: 'I need help',             rhythm: 'five quick knocks',             beats: 'qqqqq' },
  { meaning: 'The rail is slow tonight', rhythm: 'a slow rhythm of four',        beats: 'k-k-k-k' },
  { meaning: 'Dinner is ready',         rhythm: 'two quick, a pause, one',       beats: 'qq-k' },
];

function parseBeats(beats) {
  let t = 0;
  const events = [];
  for (const ch of beats) {
    if (ch === '-') { t += 0.9; continue; }
    events.push({ t, dur: ch === 'L' ? 0.4 : 0.12 });
    t += ch === 'q' ? 0.15 : 0.3;
  }
  return { events, total: t };
}

function setDoorLight(door, on) {
  if (!door || !door.mat) return;
  const target = on ? 4.0 : 0.05;
  if (door.mat.emissiveIntensity !== target) door.mat.emissiveIntensity = target;
}

function playKnock(distance) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const len = Math.floor(audioCtx.sampleRate * 0.05);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.15));
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 700;
  filt.Q.value = 1.2;
  const gain = audioCtx.createGain();
  gain.gain.value = Math.min(0.6, 4 / (distance + 2));
  src.connect(filt);
  filt.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
}

function knockSubtitle(pattern, seconds) {
  const text = heard.has(KNOCK_TOPIC)
    ? `Knocking: "${pattern.meaning}"`
    : `Knocking: ${pattern.rhythm}`;
  knockEl.textContent = text;
  knockEl.style.display = 'block';
  knockUntil = performance.now() + Math.max(seconds, 6) * 1000;
}

// --- Loading -------------------------------------------------------------------
const loader = new GLTFLoader();
const modelReady = new Promise((resolve, reject) =>
  loader.load('spine.glb', gltf => {
    scene.add(gltf.scene);
    train = gltf.scene.getObjectByName('Train') || null;
    resolve(gltf.scene);
  }, undefined, reject));

const collisionReady = fetch('spine_colliders.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' for spine_colliders.json'); return r.json(); })
  .then(data => {
    bounds = data.bounds;
    colliders = data.colliders;
    spine = data.spine;
    pois = data.pois || [];
    doors = data.doors || [];
    if (data.train) trainSpec = data.train;
    trainMin = spine.x0 + 30;
    trainMax = spine.x1 - 30 - trainSpec.length;
    trainX = trainMin;
    return data;
  });

// Titles come from the first heading of each lore file. Only the title is read here; what
// the player learns comes from the snippets in snippets.js, said by NPCs.
const titlesReady = Promise.all(TOPICS.map(file =>
  fetch('../lore/' + encodeURIComponent(file))
    .then(r => (r.ok ? r.text() : ''))
    .then(md => {
      const line = md.split(/\r?\n/).find(l => l.startsWith('# '));
      titles[file] = line ? line.replace(/^#\s*/, '').trim() : file;
    })
    .catch(() => { titles[file] = file; })));

loadHeard();

// --- NPCs: people walking the Spine, talking, and knocking on doors -------------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const random = mulberry32(NPC_SEED);
const pick = arr => arr[Math.floor(random() * arr.length)];

// Each NPC has a role. Their first line is a role line (from the lore file named in "source").
const NPC_ROLES = [
  { role: 'Batch clerk', source: 'batch_clerks_message_runners.md',
    line: 'Most people send their messages at shift changes, so the network is busy for a short time and quiet for the rest of the day.' },
  { role: 'Gait coach', source: 'gait_coaches_balance_instructors.md',
    line: 'Residents who train with a coach often say they walk differently afterwards. Some say they walk worse on land.' },
  { role: 'Tailor', source: 'clothing_textiles_and_laundry.md',
    line: 'Tailoring is one of the most common small businesses in the market halls, and it is licensed by the Market Authority.' },
  { role: 'Chronist', source: 'chronists_ship_clock_keepers.md',
    line: 'We plan the one-hour clock changes as the ship crosses longitudes, spread across the ship so nothing happens all at once.' },
  { role: 'Warden', source: 'crime_and_justice_in_practice.md',
    line: 'Most assaults happen during arguments in the terraces, the Spine bars, or the Aft Hall. We separate the people involved first.' },
  { role: 'Commissary cook', source: 'food_and_agriculture.md',
    line: 'The Commissary runs about 60 kitchens and canteens. Each adult gets a meal allowance credited to their ledger account.' },
  { role: 'Nurse', source: 'elder_care_and_end_of_life.md',
    line: 'The Harbour Care Complex is staffed by about 500 people, including nurses, carers, physiotherapists and social workers.' },
  { role: 'Teacher', source: 'childhood_and_growing_up_aboard.md',
    line: 'Children learn maritime studies from age 9. That covers basic navigation, weather and ship systems.' },
  { role: 'Market trader', source: 'markets_and_commerce.md',
    line: 'Most payments go through ledger credit cards linked to resident accounts. Cash exists only as small Company tokens.' },
  { role: 'Sail hand', source: 'crew_culture_and_seafarer_traditions.md',
    line: 'The Sail Department still sings a few shanties during lowering and raising operations.' },
  { role: 'Robot technician', source: 'automation_and_robotics.md',
    line: 'Delivery robots carry parcels along the Spine walkways and are limited to 6 km/h in crowded areas.' },
  { role: 'Chaplain', source: 'daily_life_and_routines.md',
    line: 'Religious services are held in multi-faith chapels on several decks.' },
  { role: 'Librarian', source: 'arts_media_and_entertainment.md',
    line: 'Books are lent for 21 days, and loans are free. The collection is updated at each port call.' },
  { role: 'Greenhouse worker', source: 'animals_and_pets_aboard.md',
    line: 'The greenhouses use bumblebees to pollinate tomatoes and peppers, because many plants do not pollinate well indoors.' },
];
const NPC_NAMES = ['Amara', 'Tomas', 'Lin', 'Sefa', 'Priya', 'Dmitri', 'Ines', 'Kofi', 'Hana', 'Mateo',
  'Yara', 'Oskar', 'Ada', 'Ravi', 'Noor', 'Felix', 'Mira', 'Jonas', 'Aiko', 'Samuel', 'Lena', 'Idris',
  'Clara', 'Rafael', 'Esme', 'Kwame', 'Svetla', 'Omar', 'Hugo', 'Leila', 'Bruno', 'Sana',
  'Teo', 'Nadia', 'Erik', 'Mina', 'Caleb', 'Ruth', 'Jun', 'Imani', 'Pavel', 'Rosa',
  'Gabe', 'Ayla', 'Wen', 'Ferdi', 'Ingrid', 'Malik', 'Dora', 'Tariq', 'Elin', 'Sol',
  'Reza', 'Vera', 'Joss', 'Anouk', 'Bashir', 'Lucia'];
const SHIRT_COLORS = [0x2b5c8a, 0xb5452f, 0x3c7a4a, 0xd9a441, 0x6b4c9a, 0x2f8f8f, 0xc7c7c7, 0x8a3b3b, 0x4d6e3a, 0xe0e0e0];
const SKIN_COLORS = [0xf1c9a5, 0xd9a77c, 0xa86f4c, 0x7a4a2e];
const TROUSER_COLORS = [0x2a2f3a, 0x4a4032, 0x35424e];
const KNOCK_CHANCE = 0.3;

const npcGeom = {
  torso: new THREE.CylinderGeometry(0.2, 0.24, 0.72, 8),
  head: new THREE.SphereGeometry(0.13, 10, 8),
  leg: new THREE.BoxGeometry(0.14, 0.8, 0.16),
};
let npcs = [];

function randomWalkablePoint() {
  for (let i = 0; i < 60; i++) {
    const x = spine.x0 + 15 + random() * (spine.length - 30);
    const y = (random() * 2 - 1) * 18;
    if (!blocked(x, y)) return [x, y];
  }
  return null;
}

// The knock spot is in front of a door, between the hall face and the aisle.
function doorStance(door) {
  return [door.x, door.side === 'port' ? -10.0 : 10.0];
}

// NPC lines: the role line, then one snippet from each of two assigned topics.
// Topic i is assigned to NPC i and NPC i+20, so every topic is heard by at least two people.
function linesFor(index, info) {
  const first = TOPICS[index % TOPIC_COUNT];
  const second = TOPICS[(index + 20) % TOPIC_COUNT];
  return [
    { text: info.line, topic: info.source },
    { text: SNIPPETS[first], topic: first },
    { text: SNIPPETS[second], topic: second },
  ];
}

function createNpcs() {
  npcs = [];
  for (let i = 0; i < NPC_COUNT; i++) {
    const spot = randomWalkablePoint();
    if (!spot) continue;
    const info = NPC_ROLES[i % NPC_ROLES.length];
    const group = new THREE.Group();
    const shirt = new THREE.MeshStandardMaterial({ color: pick(SHIRT_COLORS), roughness: 0.8 });
    const trousers = new THREE.MeshStandardMaterial({ color: pick(TROUSER_COLORS), roughness: 0.9 });
    const skin = new THREE.MeshStandardMaterial({ color: pick(SKIN_COLORS), roughness: 0.7 });

    const torso = new THREE.Mesh(npcGeom.torso, shirt);
    torso.position.y = 1.2;
    const head = new THREE.Mesh(npcGeom.head, skin);
    head.position.y = 1.68;
    const legL = new THREE.Group(), legR = new THREE.Group();
    legL.position.set(-0.1, 0.8, 0);
    legR.position.set(0.1, 0.8, 0);
    const legMeshL = new THREE.Mesh(npcGeom.leg, trousers);
    legMeshL.position.y = -0.4;
    const legMeshR = legMeshL.clone();
    legL.add(legMeshL);
    legR.add(legMeshR);
    group.add(torso, head, legL, legR);
    group.position.set(spot[0], 0, -spot[1]);
    scene.add(group);

    npcs.push({
      name: NPC_NAMES[i % NPC_NAMES.length], role: info.role,
      lines: linesFor(i, info), talkIndex: 0,
      x: spot[0], y: spot[1], tx: spot[0], ty: spot[1],
      speed: 0.9 + random() * 0.7, wait: random() * 3, phase: random() * 6,
      doorTarget: null, knock: null, faceUntil: 0,
      group, legL, legR,
    });
  }
}

function pickNpcTarget(n) {
  if (doors.length && random() < KNOCK_CHANCE) {
    const door = pick(doors);
    const [sx, sy] = doorStance(door);
    if (!blocked(sx, sy)) {
      n.tx = sx; n.ty = sy; n.doorTarget = door;
      return;
    }
  }
  n.doorTarget = null;
  const spot = randomWalkablePoint();
  if (spot) { n.tx = spot[0]; n.ty = spot[1]; } else { n.tx = n.x; n.ty = n.y; }
}

function startKnock(n, door) {
  const pattern = pick(KNOCK_PATTERNS);
  const timing = parseBeats(pattern.beats);
  n.knock = { pattern, ...timing, t: 0, last: -1, door };
  const dx = camera.position.x - door.x;
  const dy = -camera.position.z - door.y;
  if (Math.hypot(dx, dy) < 14) knockSubtitle(pattern, timing.total + 0.6);
}

function updateNpcs(dt) {
  const now = performance.now();
  const camX = camera.position.x, camY = -camera.position.z;
  for (const n of npcs) {
    // Knocking on a door
    if (n.knock) {
      const k = n.knock;
      k.t += dt;
      let on = false;
      for (let i = 0; i < k.events.length; i++) {
        const e = k.events[i];
        if (k.t >= e.t && k.t < e.t + e.dur) {
          on = true;
          if (k.last !== i) {
            k.last = i;
            playKnock(Math.hypot(camX - k.door.x, camY - k.door.y));
          }
        }
      }
      setDoorLight(k.door, on);
      const fx = k.door.x - n.x, fy = k.door.y - n.y;
      n.group.rotation.y = Math.atan2(fx, -fy);
      n.legL.rotation.x = 0;
      n.legR.rotation.x = 0;
      if (k.t >= k.total + 0.4) {
        setDoorLight(k.door, false);
        n.knock = null;
        n.wait = 2 + random() * 3;
        pickNpcTarget(n);
      }
      continue;
    }

    // Talking: face the player
    if (n.faceUntil > now) {
      n.group.rotation.y = Math.atan2(camX - n.x, -(camY - n.y));
    }

    if (n.wait > 0) {
      n.wait -= dt;
      n.legL.rotation.x = 0;
      n.legR.rotation.x = 0;
      continue;
    }

    const dx = n.tx - n.x, dy = n.ty - n.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.2) {
      if (n.doorTarget) {
        const door = n.doorTarget;
        n.doorTarget = null;
        startKnock(n, door);
      } else {
        n.wait = 1 + random() * 4;
        pickNpcTarget(n);
      }
      continue;
    }
    const step = Math.min(dist, n.speed * dt);
    const mx = dx / dist * step, my = dy / dist * step;
    let moved = false;
    if (!blocked(n.x + mx, n.y + my)) { n.x += mx; n.y += my; moved = true; }
    else if (!blocked(n.x + mx, n.y)) { n.x += mx; moved = true; }
    else if (!blocked(n.x, n.y + my)) { n.y += my; moved = true; }
    if (!moved) {
      n.wait = 0.5;
      pickNpcTarget(n);
      continue;
    }
    n.group.position.set(n.x, 0, -n.y);
    // three.js: local +Z is forward, and three z = -Blender y
    n.group.rotation.y = Math.atan2(mx, -my);
    n.phase += dt * 8;
    n.legL.rotation.x = Math.sin(n.phase) * 0.5;
    n.legR.rotation.x = -Math.sin(n.phase) * 0.5;
  }
}

// Talking to an NPC gives the next line; the line's topic is heard.
function talkTo(n) {
  const line = n.lines[n.talkIndex % n.lines.length];
  n.talkIndex++;
  n.faceUntil = performance.now() + 9000;
  n.wait = Math.max(n.wait, 9);
  showDialogue(`${n.name} - ${n.role}`, line.text);
  hear(line.topic, line.text);
}

// Door light and knock timing are set up in createNpcs/loading; this runs after the GLB loads.
function bindDoorLights(root) {
  for (const d of doors) {
    const mesh = root.getObjectByName(d.light);
    if (mesh && mesh.material) {
      d.mat = mesh.material;
      d.mat.emissive.set(0xffd88a);
      d.mat.emissiveIntensity = 0.05;
    }
  }
}

// --- HUD and strip map (top right) -------------------------------------------
const hud = document.getElementById('hud');
const mapCanvas = document.getElementById('map');
const mapCtx = mapCanvas.getContext('2d');
const MAP_PAD = 14;
const MAP_TRACK_Y = 26;

function updateHud() {
  const bx = camera.position.x;
  const along = Math.min(Math.max(bx - spine.x0, 0), spine.length).toFixed(0);
  hud.textContent = `The Spine - Halcyon Meridian | ${along} m along the Spine | Heard ${heard.size} / ${TOPIC_COUNT}`;
}

function mapX(x) {
  const W = mapCanvas.width - 2 * MAP_PAD;
  return MAP_PAD + ((x - spine.x0) / spine.length) * W;
}

function drawMap() {
  const ctx = mapCtx;
  const W = mapCanvas.width, H = mapCanvas.height;
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#6b6f76';
  ctx.fillRect(MAP_PAD, MAP_TRACK_Y - 3, W - 2 * MAP_PAD, 6);
  ctx.fillStyle = '#9aa4b2';
  ctx.fillRect(MAP_PAD - 8, MAP_TRACK_Y - 8, 8, 16);
  ctx.fillRect(W - MAP_PAD, MAP_TRACK_Y - 8, 8, 16);

  ctx.fillStyle = '#ffd66b';
  for (const p of pois) {
    ctx.beginPath();
    ctx.arc(mapX(p.x), MAP_TRACK_Y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#c9d2dc';
  for (const n of npcs) ctx.fillRect(mapX(n.x), MAP_TRACK_Y + 4, 1.5, 3);

  if (train) {
    const x0 = mapX(trainX), x1 = mapX(trainX + trainSpec.length);
    ctx.fillStyle = '#3a8fd6';
    ctx.fillRect(x0, MAP_TRACK_Y - 2, Math.max(x1 - x0, 2), 4);
  }

  const px = mapX(camera.position.x);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(px - 1, MAP_TRACK_Y - 12, 2, 24);

  ctx.fillStyle = '#cfd6df';
  ctx.font = '10px sans-serif';
  ctx.fillText('AFT', 2, H - 6);
  ctx.textAlign = 'right';
  ctx.fillText('FORE', W - 2, H - 6);
  ctx.textAlign = 'left';
}

// --- Set up the world once everything has loaded ------------------------------
Promise.all([modelReady, collisionReady, titlesReady]).then(([root]) => {
  bindDoorLights(root);

  // Points of interest are signs: the sign's text is said aloud as a notice, and it counts as
  // hearing its topic.
  for (const p of pois) {
    interactables.push({
      x: p.x, y: p.y, range: POI_RANGE,
      label: () => `Read sign: ${p.name}`,
      use: () => {
        showDialogue(p.name, p.text, 16);
        hear(p.source.replace(/^lore\//, ''), p.text);
      },
    });
  }

  createNpcs();
  for (const n of npcs) {
    interactables.push({
      get x() { return n.x; },
      get y() { return n.y; },
      range: NPC_RANGE,
      label: () => `Talk to ${n.name} (${n.role})`,
      use: () => talkTo(n),
    });
  }

  // Default: aft end of the Spine, in the centre aisle, looking fore.
  const params = new URLSearchParams(location.search);
  const startX = params.has('x') ? parseFloat(params.get('x')) : spine.x0 + 20;
  const startY = params.has('y') ? parseFloat(params.get('y')) : 0;
  const yaw = (params.has('yaw') ? parseFloat(params.get('yaw')) : 0) * Math.PI / 180;
  camera.position.set(startX, EYE_HEIGHT, -startY);
  camera.lookAt(startX + Math.cos(yaw) * 50, EYE_HEIGHT, -startY - Math.sin(yaw) * 50);

  // Debug parameters (for screenshots):
  //   ?shot=1        hide the start overlay
  //   ?train=600     place the train at X = 600 m and hold it
  //   ?open=N        show sign N's text
  //   ?talk=N        stand next to NPC N and talk to them
  //   ?knock=1       make NPC 0 knock on the first door right away
  //   ?journal=1     open the journal
  if (params.has('shot')) overlay.classList.add('hidden');
  if (params.has('train') && train) {
    trainX = parseFloat(params.get('train'));
    trainPause = 1e9;
  }
  if (params.has('open') && pois[parseInt(params.get('open'), 10)]) {
    const p = pois[parseInt(params.get('open'), 10)];
    showDialogue(p.name, p.text, 60);
    hear(p.source.replace(/^lore\//, ''), p.text);
  }
  if (params.has('talk') && npcs[parseInt(params.get('talk'), 10)]) {
    const n = npcs[parseInt(params.get('talk'), 10)];
    camera.position.set(n.x - 3.2, EYE_HEIGHT, -n.y);
    camera.lookAt(n.x, EYE_HEIGHT, -n.y);
    talkTo(n);
  }
  if (params.has('knock') && npcs[0] && doors[0]) {
    const [sx, sy] = doorStance(doors[0]);
    npcs[0].x = sx; npcs[0].y = sy;
    npcs[0].group.position.set(sx, 0, -sy);
    npcs[0].wait = 0;
    npcs[0].doorTarget = null;
    startKnock(npcs[0], doors[0]);
  }
  if (params.has('journal')) openJournal();
}).catch(err => {
  document.querySelector('#overlay div').textContent = 'Failed to load: ' + err;
});

// --- Loop ---------------------------------------------------------------------
const timer = new THREE.Timer();
function animate(timestamp) {
  requestAnimationFrame(animate);
  timer.update(timestamp);
  const dt = Math.min(timer.getDelta(), 0.05);
  updateTrain(dt);
  updateMovement(dt);
  if (!panelOpen) updateNpcs(dt);
  updateInteraction();
  updateOverlays();
  updateHud();
  drawMap();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
